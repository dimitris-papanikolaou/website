- type: working_paper
  title: Time-Varying Risk Premia, Firm Insurance, and Endogenous Labor Income Risk
  authors:
    - name: Maarten Meeuwis
      url: https://www.maartenmeeuwis.com/
    - name: Lawrence Schmidt
      url: https://sites.google.com/site/lawrencedwschmidt/home
  venue: null
  links:
    - label: Paper
      url: assets/papers/FirmInsuranceRiskPremia.pdf
      suffix: " (ver. 03/2026)"
  abstract: |
    We study how financial conditions shape labor income risk through endogenous firm insurance, job creation, and job destruction. We develop a directed search model with dynamic wage contracts, two-sided limited commitment, and time-varying risk premia where two forces govern the optimal contract: an insurance motive that smooths wages and a retention motive that deters poaching. When risk premia rise, limited commitment constraints tighten and insurance erodes---especially for low-wage workers near the separation margin---generating state-dependent labor income risk. Using U.S. administrative data, we document consistent evidence: the pass-through of firm productivity shocks to worker earnings rises when risk premia are elevated, concentrated among lower-paid workers and operating through job destruction. The calibrated model matches labor market dynamics, asset prices, and the heterogeneous pass-through of firm shocks. Beyond these targeted moments, it generates realistic variation in non-Gaussian earnings dynamics across workers and over time, sizable welfare losses from idiosyncratic risk, depressed human capital valuations, and large welfare gains from state-contingent policies.
    

- type: publication
  title: Time-Varying Risk Premia and Heterogenous Labor Market Dynamics
  authors:
    - name: Maarten Meeuwis
      url: https://www.maartenmeeuwis.com/
    - name: Lawrence Schmidt
      url: https://sites.google.com/site/lawrencedwschmidt/home
    - name: Jonathan Rothbaum
      url: https://sites.google.com/site/jlrothbaum/home?pli=1
  venue: American Economic Review, Forthcoming
  links:
    - label: Paper
      url: assets/papers/RiskPremia_Labor.pdf
    - label: Slides
      url: assets/slides/RiskPremia_Labor_Slides.pdf
  abstract: |
    Using U.S. administrative data on worker earnings, we show that increases in risk premia lead to
    lower labor earnings, particularly for lower-paid workers. These declines are primarily driven
    by job separations. We build an equilibrium model of labor market search that quantitatively
    replicates the observed heterogeneity in labor market dynamics across worker earnings levels.
    Our findings underscore the role of time-varying risk premia as a key driver of labor market
    fluctuations and highlight the importance of both the job creation and the job destruction
    margins in understanding the heterogeneity in worker outcomes over the business cycle.
  key_figure:
    path: assets/paper_figs/RiskPremia_Labor.png
    caption: "Pass-through of firm productivity shocks to worker earnings by worker wage quartile."

- type: publication
  title: Natural Language Processing and Innovation Research
  authors:
    - name: Antonin Bergaud
      url: https://sites.google.com/site/abergeaudeco
    - name: Adam Jaffe
      url: https://scholarworks.brandeis.edu/esploro/profile/adam_jaffe
  venue: Annual Review of Economics, Volume 18, 2025
  refereed: false
  links:
    - label: Paper
      url: assets/papers/ARE_Innovation.pdf
  abstract: |
    Innovation is central to models in economics, strategy, management, and finance, yet it remains difficult to measure due to its intangible and knowledge-based nature. Recent advancements in Natural Language Processing offer new methods to analyze textual artifacts, providing empirical insights into previously hard-to-measure aspects of innovation. This paper provides an overview of the current applications of these methods in empirical innovation research, highlights their transformative potential for reshaping how researchers study and quantify innovation, and discusses the critical challenges that accompany their use.

- type: publication
  title: "Technology and Labor Markets: Past, Present, and Future, Evidence from Two Centuries of Innovation"
  title_url: https://www.brookings.edu/events/bpea-fall-2025-conference/
  data_order: 1
  authors:
    - name: Huben Liu
    - name: Lawrence Schmidt
      url: https://sites.google.com/site/lawrencedwschmidt/home
    - name: Bryan Seegmiller
      url: https://mitsloan.mit.edu/phd/students/bryan-seegmiller
  venue: Brookings Papers on Economic Activity, Fall 2025
  links:
