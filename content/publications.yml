    - label: Data and Code
      url: https://www.dropbox.com/scl/fi/cymtyma3a8483rrgyp6wq/ReplicationPackage_TechnologyAndLaborMarkets_LiuEtAl.zip?rlkey=n2r5tzj85l7zjswfwlhycl2nn&raw=1
    - label: Summary
      url: https://www.brookings.edu/articles/technology-and-labor-markets-past-present-and-future/
    - label: Video
      url: https://www.youtube.com/watch?v=shHSyRJgDto
    - label: Podcast
      url: https://www.brookings.edu/articles/what-jobs-will-be-most-affected-by-ai/
  key_figure:
    path: assets/paper_figs/TechnologyLaborLR.png
    caption: "AI is likely to reverse the changes in labor demand brought on by 20-th century technological improvements."
  abstract: |
    We use recent advances in natural language processing and large language models to construct novel measures of technology exposure for workers that span almost two centuries. Combining our measures with Census data on occupation employment, we show that technological progress over the 20th century has led to economically meaningful shifts in labor demand across occupations: it has consistently increased demand for occupations with higher education requirements, occupations that pay higher wages, and occupations with a greater fraction of female workers. Using these insights and a calibrated model, we then explore different scenarios for how advances in artificial intelligence (AI) are likely to impact employment trends in the medium run. The model predicts a reversal of past trends, with AI favoring occupations that are lower-educated, lower-paid, and more male-dominated.

- type: publication
  title: "Measuring Document Similarity With Weighted Averages of Word Embeddings"
  title_url: https://www.sciencedirect.com/science/article/abs/pii/S0014498322000729
  authors:
    - name: Lawrence Schmidt
      url: https://sites.google.com/site/lawrencedwschmidt/home
    - name: Bryan Seegmiller
      url: https://mitsloan.mit.edu/phd/students/bryan-seegmiller
  venue: Explorations in Economic History, 2023, 87
  links:
    - label: Paper
      url: assets/papers/kps_eeh.pdf
  abstract: |
    We detail a methodology for estimating the textual similarity between two documents while
    accounting for the possibility that two different words can have a similar meaning. We illustrate
    the method's usefulness in facilitating comparisons between documents with very different formats
    and vocabularies by textually linking occupation task and industry output descriptions with
    related technologies as described in patent texts; we also examine economic applications of the
    resultant document similarity measures. In a final application we demonstrate that the method
    also works well relative to alternatives for comparing documents within the same domain by
    showing that pairwise textual similarity between occupations' task descriptions strongly predicts
    the probability that a given worker will transition from one occupation to another. Finally, we
    offer some suggestions on other potential uses and guidance in implementing the method.

- type: publication
  title: Intangible Value
  title_url: https://www.nowpublishers.com/article/Details/CFR-0113
  data_order: 4
  authors:
    - name: Andrea Eisfeldt
      url: http://www.anderson.ucla.edu/x33175.xml
    - name: Edward Kim
      url: https://edwardtkim.github.io/
  venue: Critical Finance Review, 2023, 11(2)
  links:
    - label: Paper
      url: assets/papers/Intangible_Value.pdf
    - label: Data and Code
      url: https://github.com/edwardtkim/intangiblevalue
  key_figure:
    path: assets/paper_figs/Intangible_Value.png
    caption: "Adjusting book value for intangibles restores the recent performance of value strategies based on book-to-market."
  abstract: |
    Intangible assets are absent from traditional measures of value, despite their
    very large (and growing) importance in firms' capital stocks. As a result, the
    fundamental anchor for value that uses book assets is mismeasured. We propose
    a simple improvement to the classic value factor (HMLFF) proposed by Fama
    and French (1992, 1993). Our intangible value factor, HMLINT, prices assets
    as well as or better than the traditional value factor but yields substantially
    higher returns. This outperformance holds over the entire sample, as well as in
    more recent decades in which value has underperformed. We show that this is
    likely due to the intangible value factor sorting more effectively on productivity,
    profitability, financial soundness, and on other valuation ratios such as price to
    earnings or price to sales.

- type: publication
  title: The Economics of Intangible Capital
  title_url: https://www.aeaweb.org/articles?id=10.1257/jep.36.3.29
  authors:
    - name: Nicolas Crouzet
      url: https://www.kellogg.northwestern.edu/faculty/crouzet/html/index.html
    - name: Janice Eberly
      url: https://www.kellogg.northwestern.edu/faculty/directory/eberly_janice_c.aspx
    - name: Andrea Eisfeldt
      url: http://www.anderson.ucla.edu/x33175.xml
  venue: Journal of Economic Perspectives, 2022, 36(3)
  links:
    - label: Paper
      url: https://www.aeaweb.org/articles?id=10.1257/jep.36.3.29
    - label: "Companion Paper: A Model of Intangible Capital"
      url: https://www.nber.org/papers/w30376
  abstract: |
    Intangible assets are a large and growing part of firms' capital stocks. Intangibles are accumulated via investment--foregoing consumption today for output in the future—but they lack a physical presence. Rather than stopping with this "lack," we instead focus on the positive properties of intangibles. Specifically, intangibles must be stored, so characteristics of the storage medium have important implications for their value and use. These properties include non-rivalry, allowing the intangible to be used simultaneously in different production streams, and limited excludability, which prevents the firm from capturing all the benefits or rents from the intangible. We develop these ideas in a simple way to illustrate how outcomes such as scalability and distribution of ownership follow. We discuss how intangibles can help to understand important trends in macroeconomics and finance, including productivity, factor shares, inequality, investment and valuation, rents and market power, and firm financing.

- type: publication
  title: Working Remotely and the Supply-side Impact of Covid-19
  title_url: https://doi.org/10.1093/rapstu/raab026
  data_order: 5
  authors:
    - name: Lawrence Schmidt
      url: https://sites.google.com/site/lawrencedwschmidt/home
  venue: Review of Asset Pricing Studies, 2022, 12(1)
  links:
    - label: Paper
      url: assets/papers/Covid19exposures.pdf
    - label: Data
      url: https://www.thecovidfactor.org/
  abstract: |
    We analyze the supply-side disruptions associated with COVID-19. We find that sectors in which a higher fraction of the workforce is not able to work remotely experienced greater declines in employment and expected revenue growth, worse stock market performance, and higher likelihood of default. The stock market overweights low-exposure industries. Thus, our findings cast light on the disconnect between stock market indices and aggregate outcomes. We combine these ex ante heterogeneous industry exposures with daily financial market data to create a stock return portfolio that tracks news about the supply-side disruptions resulting from the pandemic.

- type: publication
  title: Missing Novelty in Drug Development
  title_url: https://academic.oup.com/rfs/article/35/2/636/6178014
  data_order: 6
  authors:
    - name: Danielle Li
      url: https://mitsloan.mit.edu/faculty/directory/danielle-li
    - name: Joshua Krieger
      url: https://www.hbs.edu/faculty/Pages/profile.aspx?facId=951435
