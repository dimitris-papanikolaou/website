# Render Quarto website on push to main and commit rendered docs/ so GitHub Pages (main / docs) stays up to date.
# In repo Settings > Pages, set Source to "Deploy from branch" > main > /docs.

on:
  workflow_dispatch:
  push:
    branches: [ main ]

name: Quarto Render

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: false

      - name: Install R dependencies
        run: Rscript -e "install.packages(c('yaml', 'knitr', 'rmarkdown'), repos = 'https://cloud.r-project.org')"

      - name: Render site
        run: quarto render

      - name: Commit and push docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --staged --quiet || git commit -m "Render site (Quarto)"
          git push
